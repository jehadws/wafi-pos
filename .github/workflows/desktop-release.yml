name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, curl, zip

      - name: Install Composer dependencies
        run: |
          cd app
          composer install --no-dev --optimize-autoloader

      - name: Build Web Frontend Assets
        run: |
          cd app
          npm ci
          npm run build

      - name: Build Electron Shell
        run: |
          cd desktop
          npm ci
          npm run build
          npx electron-builder --dir

      - name: Compile Inno Setup Installer
        uses: MinCi/action-innosetup@v1
        with:
          iss-path: installer/setup.iss

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubulPOS-Setup
          path: dist/installer/*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
